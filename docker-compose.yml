services:
  postgres:
    image: postgres:16-alpine
    container_name: hlm-postgres
    environment:
      POSTGRES_USER: hyperlocalmart
      POSTGRES_PASSWORD: hyperlocalmart
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperlocalmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hlm-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass hyperlocalmart

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hlm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hlm-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hlm-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8099:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: hlm-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"

  minio:
    image: minio/minio:latest
    container_name: hlm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hyperlocalmart
      MINIO_ROOT_PASSWORD: hyperlocalmart
    ports:
      - "9000:9000"
      - "9001:9001"

volumes: {}
