server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_user}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7
    login:
      max-failed-attempts: 5
      lock-duration-minutes: 30
    otp:
      expiration-minutes: 5
      max-requests-per-hour: 5
      max-verify-attempts: 5
      # Local/dev only — password reset always accepts 111111. Clear this in production.
      fixed-code: ${PASSWORD_RESET_OTP_FIXED_CODE:111111}
  invite:
    # Comma-separated. Empty = allow all (dev). Non-empty = only listed phones can register.
    buyer-phones: ${BUYER_INVITE_PHONES:}
    require-terms: true
  town-service:
    base-url: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
  payment-service:
    base-url: ${HLM_PAYMENT_SERVICE_URI:http://localhost:8087}
  order-service:
    base-url: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.hyperlocalmart.user: INFO
