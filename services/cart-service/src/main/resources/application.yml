server:
  port: 8085

spring:
  application:
    name: cart-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_cart}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
      access-token-expiration-minutes: 60
  catalog-service:
    base-url: ${HLM_CATALOG_SERVICE_URI:http://localhost:8084}
  order-service:
    base-url: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}
  vendor-service:
    base-url: ${HLM_VENDOR_SERVICE_URI:http://localhost:8083}
  town-service:
    base-url: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
