server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_payment}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  order-service:
    base-url: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}
  town-service:
    base-url: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
  user-service:
    base-url: ${HLM_USER_SERVICE_URI:http://localhost:8081}
  vendor-service:
    base-url: ${HLM_VENDOR_SERVICE_URI:http://localhost:8083}
  delivery-service:
    base-url: ${HLM_DELIVERY_SERVICE_URI:http://localhost:8088}
  payment:
    razorpay-queue:
      enabled: ${HLM_RAZORPAY_QUEUE:true}
      max-concurrent: ${HLM_RAZORPAY_QUEUE_WORKERS:8}
      queue-capacity: ${HLM_RAZORPAY_QUEUE_CAPACITY:512}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpay-api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    checkout-name: ${RAZORPAY_CHECKOUT_NAME:KoYaKart}
    checkout-logo-url: ${RAZORPAY_CHECKOUT_LOGO_URL:}
    dev-webhook-bypass-secret: ${PAYMENT_DEV_WEBHOOK_BYPASS:dev-bypass}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
