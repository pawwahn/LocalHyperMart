server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_payment}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  order-service:
    base-url: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}
  vendor-service:
    base-url: ${HLM_VENDOR_SERVICE_URI:http://localhost:8083}
  delivery-service:
    base-url: ${HLM_DELIVERY_SERVICE_URI:http://localhost:8088}
  payment:
    dev-webhook-bypass-secret: dev-bypass

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
