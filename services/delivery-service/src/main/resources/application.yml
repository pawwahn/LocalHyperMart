server:
  port: 8088

spring:
  application:
    name: delivery-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_delivery}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  order-service:
    base-url: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}
  user-service:
    base-url: ${HLM_USER_SERVICE_URI:http://localhost:8081}
  town-service:
    base-url: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
  vendor-service:
    base-url: ${HLM_VENDOR_SERVICE_URI:http://localhost:8083}
  notification-service:
    base-url: ${HLM_NOTIFICATION_SERVICE_URI:http://localhost:8089}
  delivery:
    otp:
      # Local/dev only — agent can always enter 111111. Clear this in production.
      fixed-code: ${DELIVERY_OTP_FIXED_CODE:111111}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
