server:
  port: 8082

spring:
  application:
    name: town-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hyperlocalmart_town
    username: hyperlocalmart
    password: hyperlocalmart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
