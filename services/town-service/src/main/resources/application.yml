server:
  port: 8082

spring:
  application:
    name: town-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_town}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  delivery-service:
    base-url: ${HLM_DELIVERY_SERVICE_URI:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
