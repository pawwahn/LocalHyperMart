server:
  port: 8091

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hyperlocalmart_media
    username: hyperlocalmart
    password: hyperlocalmart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:${user.home}/.hyperlocalmart/media}
