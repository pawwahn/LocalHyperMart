server:
  port: 8089

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_notification}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
