# Activate with spring.profiles.include=redis-cache (or HLM_CATALOG_BROWSE_CACHE=true + this profile).
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hyperlocalmart}
  cache:
    type: redis

hyperlocalmart:
  cache:
    catalog-browse:
      enabled: true
