server:
  port: 8086

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hyperlocalmart_order
    username: hyperlocalmart
    password: hyperlocalmart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  cart-service:
    base-url: http://localhost:8085
  catalog-service:
    base-url: http://localhost:8084
  delivery-service:
    base-url: http://localhost:8088
  user-service:
    base-url: http://localhost:8081
  town-service:
    base-url: http://localhost:8082
  payment-service:
    base-url: http://localhost:8087
  notification-service:
    base-url: http://localhost:8089
  checkout:
    delivery-fee: 40.00
