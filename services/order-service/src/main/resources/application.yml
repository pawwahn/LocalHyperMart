server:
  port: 8086

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hyperlocalmart_order}
    username: ${SPRING_DATASOURCE_USERNAME:hyperlocalmart}
    password: ${SPRING_DATASOURCE_PASSWORD:hyperlocalmart}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  cart-service:
    base-url: ${HLM_CART_SERVICE_URI:http://localhost:8085}
  catalog-service:
    base-url: ${HLM_CATALOG_SERVICE_URI:http://localhost:8084}
  delivery-service:
    base-url: ${HLM_DELIVERY_SERVICE_URI:http://localhost:8088}
  user-service:
    base-url: ${HLM_USER_SERVICE_URI:http://localhost:8081}
  town-service:
    base-url: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
  payment-service:
    base-url: ${HLM_PAYMENT_SERVICE_URI:http://localhost:8087}
  notification-service:
    base-url: ${HLM_NOTIFICATION_SERVICE_URI:http://localhost:8089}
  checkout:
    delivery-fee: 40.00
