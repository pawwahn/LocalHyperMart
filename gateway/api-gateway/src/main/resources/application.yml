server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters: []

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}
  services:
    user: ${HLM_USER_SERVICE_URI:http://localhost:8081}
    town: ${HLM_TOWN_SERVICE_URI:http://localhost:8082}
    vendor: ${HLM_VENDOR_SERVICE_URI:http://localhost:8083}
    catalog: ${HLM_CATALOG_SERVICE_URI:http://localhost:8084}
    cart: ${HLM_CART_SERVICE_URI:http://localhost:8085}
    order: ${HLM_ORDER_SERVICE_URI:http://localhost:8086}
    payment: ${HLM_PAYMENT_SERVICE_URI:http://localhost:8087}
    delivery: ${HLM_DELIVERY_SERVICE_URI:http://localhost:8088}
    notification: ${HLM_NOTIFICATION_SERVICE_URI:http://localhost:8089}
    billing: ${HLM_BILLING_SERVICE_URI:http://localhost:8090}
    media: ${HLM_MEDIA_SERVICE_URI:http://localhost:8091}
    reporting: ${HLM_REPORTING_SERVICE_URI:http://localhost:8092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
