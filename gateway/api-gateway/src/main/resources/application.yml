server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters: []

hyperlocalmart:
  security:
    jwt:
      secret: ${JWT_SECRET:hyperlocalmart-dev-secret-change-in-production-min-32-chars!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
